<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Edwins Kalas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0a0a0f; --gold: #c8a83c; --red: #e63946;
      --text: #f0ede0; --muted: #8a8a9a; --border: rgba(200,168,60,0.25);
    }
    body { background: var(--black); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; padding: 2rem 1.5rem; }
    h1 { color: var(--gold); font-size: 1.5rem; margin-bottom: 0.3rem; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
    .login-box { max-width: 360px; margin: 4rem auto; border: 1px solid var(--border); border-radius: 8px; padding: 2rem; background: rgba(255,255,255,0.03); }
    .login-box h2 { color: var(--gold); margin-bottom: 1.2rem; font-size: 1.1rem; letter-spacing: .1em; }
    input[type=password], input[type=text] {
      width: 100%; padding: .65rem .85rem; background: rgba(255,255,255,.05);
      border: 1px solid var(--border); border-radius: 4px; color: var(--text);
      font-size: 1rem; font-family: system-ui; outline: none; margin-bottom: .9rem;
    }
    input:focus { border-color: var(--gold); }
    button { padding: .65rem 1.4rem; border: none; border-radius: 4px; font-family: system-ui; font-weight: 700; letter-spacing: .1em; cursor: pointer; transition: opacity .15s; }
    button:hover { opacity: .85; }
    .btn-primary { background: var(--gold); color: #111; }
    .btn-danger  { background: var(--red);  color: #fff; }
    .btn-export  { background: rgba(200,168,60,.15); color: var(--gold); border: 1px solid var(--border); }
    .error { color: var(--red); font-size: .85rem; margin-top: .5rem; }
    .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: .5rem; }
    .tab { padding: .45rem 1.1rem; border-radius: 4px 4px 0 0; background: transparent; color: var(--muted); font-size: .85rem; letter-spacing: .06em; border: 1px solid transparent; cursor: pointer; }
    .tab.active { color: var(--gold); border-color: var(--border); border-bottom-color: var(--black); background: rgba(200,168,60,.07); }
    .panel { display: none; } .panel.active { display: block; }
    .actions { display: flex; gap: .75rem; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center; }
    .count { color: var(--muted); font-size: .8rem; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th { color: var(--gold); text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--border); font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; }
    td { padding: .5rem .7rem; border-bottom: 1px solid rgba(255,255,255,.05); color: var(--text); vertical-align: top; }
    tr:hover td { background: rgba(255,255,255,.03); }
    .empty { color: var(--muted); font-size: .9rem; padding: 2rem 0; text-align: center; }
    #danger-zone { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(230,57,70,.25); }
    #danger-zone h3 { color: var(--red); font-size: .9rem; letter-spacing: .1em; margin-bottom: .8rem; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-section">
  <div class="login-box">
    <h2>ADMIN-INLOGGNING</h2>
    <input type="password" id="admin-key" placeholder="Admin-nyckel" autocomplete="current-password">
    <button class="btn-primary" id="login-btn" style="width:100%">LOGGA IN</button>
    <p class="error" id="login-error" style="display:none">Fel nyckel, försök igen.</p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" style="display:none; max-width:960px; margin:0 auto;">
  <h1>Edwins Ninjakalas – Admin</h1>
  <p class="subtitle">Inloggad som admin</p>

  <div class="tabs">
    <button class="tab active" data-tab="guests">OSA-LISTA</button>
    <button class="tab" data-tab="scores">HIGHSCORES</button>
  </div>

  <!-- Guests panel -->
  <div class="panel active" id="panel-guests">
    <div class="actions">
      <button class="btn-export" id="export-guests-btn">Exportera CSV</button>
      <span class="count" id="guests-count"></span>
    </div>
    <div id="guests-table-wrap"></div>
  </div>

  <!-- Scores panel -->
  <div class="panel" id="panel-scores">
    <div class="actions">
      <button class="btn-export" id="export-scores-btn">Exportera CSV</button>
      <span class="count" id="scores-count"></span>
    </div>
    <div id="scores-table-wrap"></div>
  </div>

  <!-- Danger zone -->
  <div id="danger-zone">
    <h3>FARLIG ZON</h3>
    <button class="btn-danger" id="reset-btn">Rensa all data</button>
  </div>
</div>

<script>
'use strict';
let adminKey = sessionStorage.getItem('adminKey') || '';
let guestsData = [], scoresData = [];

// ── Auth ──────────────────────────────────────────────────────────────────
async function tryLogin(key) {
  const res = await fetch('/api/admin/guests', { headers: { 'Authorization': 'Bearer ' + key } });
  return res.status !== 401;
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const key = document.getElementById('admin-key').value.trim();
  const ok = await tryLogin(key);
  if (ok) {
    adminKey = key;
    sessionStorage.setItem('adminKey', key);
    showDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
});
document.getElementById('admin-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

// Auto-login if key cached
if (adminKey) tryLogin(adminKey).then(ok => { if (ok) showDashboard(); });

// ── Dashboard ─────────────────────────────────────────────────────────────
function showDashboard() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadGuests(); loadScores();
}

function authHeaders() { return { 'Authorization': 'Bearer ' + adminKey }; }

async function loadGuests() {
  const res = await fetch('/api/admin/guests', { headers: authHeaders() });
  guestsData = await res.json();
  document.getElementById('guests-count').textContent = `${guestsData.length} anmälda`;
  renderGuests();
}

async function loadScores() {
  const res = await fetch('/api/admin/scores', { headers: authHeaders() });
  scoresData = await res.json();
  document.getElementById('scores-count').textContent = `${scoresData.length} resultat`;
  renderScores();
}

function renderGuests() {
  const wrap = document.getElementById('guests-table-wrap');
  if (!guestsData.length) { wrap.innerHTML = '<p class="empty">Inga anmälningar ännu.</p>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>#</th><th>Namn</th><th>Antal gäster</th><th>Matallergier</th><th>Hälsning</th><th>Tidpunkt</th>
    </tr></thead>
    <tbody>${guestsData.map((r,i) => `<tr>
      <td>${i+1}</td>
      <td>${esc(r.name)}</td>
      <td>${r.antal_gaster}</td>
      <td>${esc(r.matallergier || '–')}</td>
      <td>${esc(r.halsning || '–')}</td>
      <td>${new Date(r.created_at).toLocaleString('sv-SE')}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function renderScores() {
  const wrap = document.getElementById('scores-table-wrap');
  if (!scoresData.length) { wrap.innerHTML = '<p class="empty">Inga poäng ännu.</p>'; return; }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>#</th><th>Namn</th><th>Poäng</th><th>Svårighet</th><th>Nivå</th><th>Kills</th><th>Tidpunkt</th>
    </tr></thead>
    <tbody>${scoresData.map((r,i) => `<tr>
      <td>${i+1}</td>
      <td>${esc(r.name)}</td>
      <td>${Number(r.score).toLocaleString('sv')}</td>
      <td>${r.difficulty}</td>
      <td>${r.level}</td>
      <td>${r.kills}</td>
      <td>${new Date(r.created_at).toLocaleString('sv-SE')}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ── CSV export ────────────────────────────────────────────────────────────
function exportCSV(data, filename) {
  if (!data.length) return;
  const headers = Object.keys(data[0]).join(',');
  const rows = data.map(r =>
    Object.values(r).map(v =>
      v === null || v === undefined ? '' :
      String(v).includes(',') || String(v).includes('"') || String(v).includes('\n')
        ? '"' + String(v).replace(/"/g, '""') + '"' : v
    ).join(',')
  );
  const csv = [headers, ...rows].join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('export-guests-btn').addEventListener('click', () =>
  exportCSV(guestsData, 'edwins_osa.csv'));
document.getElementById('export-scores-btn').addEventListener('click', () =>
  exportCSV(scoresData, 'edwins_highscores.csv'));

// ── Reset ─────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', async () => {
  if (!confirm('Är du säker? All data (OSA + poäng) raderas permanent.')) return;
  await fetch('/api/admin/reset', { method: 'DELETE', headers: authHeaders() });
  guestsData = []; scoresData = [];
  renderGuests(); renderScores();
  document.getElementById('guests-count').textContent = '0 anmälda';
  document.getElementById('scores-count').textContent = '0 resultat';
});

// ── XSS escape ────────────────────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
