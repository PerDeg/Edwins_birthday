<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Edwins Ninjaäventyr</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <a href="/" id="back-link">← Tillbaka</a>

  <canvas id="game-canvas" style="position:absolute;"></canvas>

  <!-- Menu overlay: shown on start screen, hidden during play -->
  <div id="menu-overlay">
    <button id="btn-start-game">JAG VILL VARA EN NINJA!</button>
  </div>

  <!-- Score / name-entry overlay (shown after game over or victory) -->
  <div id="submit-overlay">
    <div id="submit-box">
      <div id="submit-heading">GAME OVER</div>
      <div id="submit-score"></div>
      <label id="submit-name-label">Spara ditt resultat:</label>
      <div id="submit-save-row">
        <input id="name-input" type="text" maxlength="20"
               placeholder="Ninja-namn…" autocomplete="off" spellcheck="false">
        <button id="btn-save-score" class="ui-btn ui-btn-gold">Spara</button>
      </div>
      <div id="submit-rank" style="display:none">
        Du kom på plats #<span id="rank-num"></span>! 🏆
      </div>
      <div id="submit-btn-row">
        <button id="btn-play-again" class="ui-btn">Spela igen</button>
        <button id="btn-quit"       class="ui-btn ui-btn-red">Avbryt</button>
      </div>
    </div>
  </div>

  <!-- Mobile touch controls -->
  <div id="touch-controls">
    <button id="btn-left"   class="touch-btn">◀</button>
    <button id="btn-right"  class="touch-btn">▶</button>
    <button id="btn-down"   class="touch-btn">▼</button>
    <button id="btn-jump"   class="touch-btn">⬆</button>
    <button id="btn-attack" class="touch-btn">⚔</button>
    <button id="btn-throw"  class="touch-btn">✦</button>
  </div>

  <!-- Game scripts — order matters -->
  <script src="js/game-constants.js"></script>
  <script src="js/game-audio.js"></script>
  <script src="js/game-particles.js"></script>
  <script src="js/game-background.js"></script>
  <script src="js/game-sprites.js"></script>
  <script src="js/game-entities.js"></script>
  <script src="js/game-hud.js"></script>
  <script src="js/game-ui.js"></script>
  <script src="js/game-level.js"></script>
  <script src="js/game-update.js"></script>
  <script src="js/game-draw.js"></script>
  <script src="js/game-main.js"></script>
</body>
</html>
